name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Self-hosted lab runners host four jobs per VM on eight cores. Go sizes
# its build parallelism from the host core count, so each job fans out as
# if it owned the machine and four of them together exhaust the VM's
# memory. Runner-level env does not cross into container jobs; workflow
# env is part of the job context, which the runner does carry in.
env:
  GOMAXPROCS: 2

jobs:
  security:
    name: Security Scans
    runs-on: self-hosted
    timeout-minutes: 30
    # Fork pull requests must not run untrusted code on a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    container:
      # Digest-pinned golang:1.27 (self-hosted runner has no build tools on the host)
      image: golang:1.27@sha256:65b6f280bf050ec5af12716857e8ea8439d694dbba8f31ceeb7630670071f2bb
      # The container filesystem is fresh on every job, so the Go module and
      # build caches would start cold. These are host paths rather than the
      # Actions cache service: on a persistent self-hosted runner, restoring a
      # ~2GB cache.tzst costs more than the build it saves and floods the log
      # with tar "Cannot open: File exists" errors against Go's read-only
      # module cache. They live outside _work, so the runner's workspace
      # reclaim hook leaves them alone and root ownership here is harmless.
      volumes:
        - /home/runner/gha-container-cache/go:/go
        - /home/runner/gha-container-cache/go-build:/root/.cache/go-build

    env:
      # The runner overrides HOME to /github/home inside the container, so the
      # default GOCACHE would land there -- inside _work/_temp, wiped between
      # jobs and outside the mount above. Point it at the mounted path.
      GOCACHE: /root/.cache/go-build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mark workspace safe for git
        # The host-mounted workspace has a different owner than the container
        # user; without this, go tools fail with "error obtaining VCS status"
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/pve_cpi/go.mod
          # The mounted /go volume is the module cache; the action's own
          # cache would restore a second copy over it and fail on tar.
          cache: false

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: Install trivy
        # SHA-pinned: upstream deletes old tags (v0.2.0 vanished and broke scheduled runs)
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Run security scans
        # REQUIRE_TOOLS makes a missing scanner a failure rather than
        # a skip, so a broken install step cannot silently pass the gate.
        run: make security REQUIRE_TOOLS=1
