---
# Ops file: layer the pve_cpi CPI onto cloudfoundry/bosh-deployment's bosh.yml.
#
# Usage:
#   bosh create-env ~/w/cloudfoundry/bosh-deployment/bosh.yml \
#     --state=manifests/bosh/state.json \
#     --vars-store=manifests/bosh/creds.yml \
#     -o  manifests/bosh/cpi.yml \
#     -o  ~/w/cloudfoundry/bosh-deployment/uaa.yml \
#     -o  ~/w/cloudfoundry/bosh-deployment/credhub.yml \
#     -l  manifests/bosh/vars.yml \
#     -v  director_name=ocfp-mgmt
#
# Requires a local release tarball produced by ./scripts/create-release dev
# (path is read from var pve_cpi_release_path).

- type: replace
  path: /releases/name=bosh-pve-cpi?
  value:
    name: bosh-pve-cpi
    url: file://((pve_cpi_release_path))

# Stemcell: openstack-kvm jammy works on PVE (qemu/KVM).
- type: replace
  path: /resource_pools/name=vms/stemcell?
  value:
    url: ((stemcell_url))
    sha1: ((stemcell_sha1))

- type: replace
  path: /resource_pools/name=vms/cloud_properties?
  value:
    cpu: ((director_cpu))
    memory: ((director_memory))
    disk: ((director_disk))

- type: replace
  path: /disk_pools/name=disks/cloud_properties?
  value:
    # ----------------------------------------------------------------------
    # Persistent-disk cloud_properties (all keys optional).
    #
    # The CPI classifies the target storage as shared (cluster-visible: rbd,
    # cephfs, nfs, cifs, glusterfs, pbs, or any storage with shared=1) or
    # local (lvm, lvmthin, zfspool, dir, btrfs). See docs/persistent-disks.md
    # for the full backend matrix and worked examples.
    # ----------------------------------------------------------------------
    #
    # storage: ceph-rbd      # Shared backend (auto-detected by type=rbd).
    # storage: local-zfs     # Local backend; co-locates with the owner VM.
    # node: pve-02           # Local backend: pin disks to this node.
    # disk_format: raw       # Required for lvm/lvmthin/zfspool block storages.
    {}

- type: replace
  path: /networks/name=default/subnets/0/cloud_properties?
  value:
    bridge: ((pve_network_bridge))

# Tell the director which CPI job to invoke once it's running.
- type: replace
  path: /instance_groups/name=bosh/properties/director/cpi_job?
  value: pve_cpi

# Insert pve_cpi job into the bosh instance group.
#
# Note: we deliberately do NOT set a job-level `agent` property here. BOSH
# manifest property resolution makes a job-level `properties.agent` shadow the
# instance-group-level `properties.agent` from bosh-deployment's bosh.yml
# (which supplies `agent.mbus: nats://((internal_ip)):4222`). The director
# reads its own `agent.mbus` to populate the `mbus` field in the agent_settings
# JSON it hands to every CPI create_vm call. If we shadow that with an empty
# string, every deployed VM's agent boots with mbus="" and the CPI rejects
# the call with "agent settings vm N: mbus is empty". Leaving the bosh.yml
# default in place is the correct behaviour: the CPI receives agent_settings
# per-invocation and forwards them into the VM, so the release does not need
# its own agent property override.
- type: replace
  path: /instance_groups/name=bosh/jobs/-
  value:
    name: pve_cpi
    release: bosh-pve-cpi
    properties:
      pve: &pve_props
        host: ((pve_host))
        port: ((pve_port))
        user: ((pve_user))
        password: ((pve_password))
        api_token: ((pve_api_token))
        node: ((pve_node))
        vm_storage: ((pve_vm_storage))
        disk_storage: ((pve_disk_storage))
        stemcell_storage: ((pve_stemcell_storage))
        iso_storage: ((pve_iso_storage))
        network_bridge: ((pve_network_bridge))
        network_mode: ((pve_network_mode))
        sdn_zone: ((pve_sdn_zone))
        sdn_zone_type: ((pve_sdn_zone_type))
        sdn_auto_manage_zone: ((pve_sdn_auto_manage_zone))
        verify_ssl: ((pve_verify_ssl))
        agent_mode: cloudinit
        vm_disk_format: qcow2
        log_level: info
        vm_prefix: ((pve_vm_prefix))
        create_env_deployment: ((pve_create_env_deployment))
        vmid_range_start: ((pve_vmid_range_start))
        vmid_range_end: ((pve_vmid_range_end))
        allow_disk_ops_with_snapshots: ((pve_allow_disk_ops_with_snapshots))
        require_snapshot_check_pass: ((pve_require_snapshot_check_pass))
        hotplug: ((pve_hotplug))
        numa: ((pve_numa))
        reboot_mode: ((pve_reboot_mode))
        reboot_timeout: ((pve_reboot_timeout))

# cloud_provider drives create-env itself.
- type: replace
  path: /cloud_provider/template?
  value:
    name: pve_cpi
    release: bosh-pve-cpi

- type: replace
  path: /cloud_provider/properties/pve?
  value: *pve_props

# Note: do NOT replace /cloud_provider/properties/agent here. bosh-deployment's
# bosh.yml supplies the create-env agent bind URL
# (https://mbus:((mbus_bootstrap_password))@0.0.0.0:6868), and bosh int only
# resolves ((vars)) at the manifest top level — pre-baking the URL via a
# vars.yml value with an inner ((mbus_bootstrap_password)) reference does not
# expand recursively, so an override here either wipes the bind URL (empty
# pve_agent_mbus) or hard-codes a stale password. Leaving the bosh.yml default
# in place keeps bosh-init <-> agent bootstrap working. The CPI-driven agent
# properties for deployed instance groups still flow through
# /instance_groups/name=bosh/jobs/-/properties/agent above.
