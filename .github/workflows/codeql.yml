name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: self-hosted
    timeout-minutes: 30
    # Fork pull requests must not run untrusted code on a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["go"]

    steps:
      - name: Drop a workspace clone an earlier job left partial
        # The linear-history job used to check out a tree:0 promisor clone into
        # this shared workspace, and a runner that ran it once kept that clone.
        # The next full checkout on that runner then came up with a commit and
        # no files, which setup-go reported as a missing go.mod. Remove the
        # clone when it carries either mark, so checkout starts from nothing.
        # On a healthy workspace this step does nothing.
        shell: sh
        run: |
          ws="${GITHUB_WORKSPACE}"
          if [ -f "$ws/.git/config" ] && grep -qE 'partialclonefilter|sparseCheckout' "$ws/.git/config" "$ws/.git/config.worktree" 2>/dev/null; then
            echo "removing the partial clone in $ws"
            rm -rf "$ws/.git"
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        # CodeQL runs on the runner host rather than in the golang container,
        # so the toolchain comes from setup-go instead of the image.
        uses: actions/setup-go@v7
        with:
          go-version-file: src/pve_cpi/go.mod
          # This job runs on the host, where ~/go/pkg/mod persists between
          # jobs. Restoring the action's cache over it fails in tar against
          # Go's read-only module cache, and buys nothing.
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Manual: the module lives in src/pve_cpi, not at the repository
          # root, so autobuild has nothing to find where it looks first.
          build-mode: manual

      - name: Build
        run: cd src/pve_cpi && go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
