---
# Minimal smoke-test deployment: one bare stemcell VM, no jobs.
# Verifies director ↔ pve_cpi end-to-end (create_vm, attach_disk, agent
# handshake) without needing a real release.
#
# Deploy with:
#   bosh -e bosh-pve -d emptyvm deploy manifests/bosh/emptyvm.yml \
#     -l manifests/bosh/vars.yml
#
# Teardown:
#   bosh -e bosh-pve -d emptyvm delete-deployment

name: emptyvm

releases: []

stemcells:
- alias:   default
  os:      ubuntu-noble
  version: latest

instance_groups:
- name:      emptyvm
  instances: 1
  jobs:      []
  vm_type:   small
  stemcell:  default
  azs:       [ z1 ]
  networks:
  - name: default

update:
  canaries:          1
  max_in_flight:     1
  # Trimmed watch-time floors (5s -> 2s): the single jobless instance reports
  # healthy as soon as the agent is up, so the 5s floor is dead time. MAX
  # window unchanged. The step is dominated by the stemcell clone + agent
  # handshake, so this is a marginal (few-second) trim.
  canary_watch_time: 2000-30000
  update_watch_time: 2000-30000
  serial:            true
