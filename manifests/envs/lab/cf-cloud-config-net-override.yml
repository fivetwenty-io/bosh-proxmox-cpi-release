---
# Env bundle: lab — CF cloud-config network override (legacy variant).
#
# Note: prefer cf-cloud-config.yml in this same dir; it's the version
# auto-layered by BOSH_PVE_ENV=lab. This file is kept for the alternative
# IPAM layout (static haproxy slot + tighter dynamic band).
#
# CF IPAM layout (within 10.64.64.0/18):
#   10.64.64.1-10.64.64.19   reserved (gateway, infra, BOSH directors, artifacts VM)
#   10.64.64.20-10.64.64.49  dynamic (CF VMs, BOSH-managed)
#   10.64.64.50               haproxy (static — must match haproxy_private_ip in vars.yml)
#   10.64.64.51-10.64.127.254 reserved (upper band; prevents BOSH over-allocating
#                              into addresses reserved for future blocs)
#
# Usage:
#   bosh update-cloud-config manifests/cf/cloud-config.yml \
#     -o manifests/envs/lab/cf-cloud-config-net-override.yml \
#     -l manifests/bosh/vars.yml -l manifests/cf/vars.yml

- type: replace
  path: /networks/name=default/subnets/0/range
  value: 10.64.64.0/18

- type: replace
  path: /networks/name=default/subnets/0/gateway
  value: 10.64.64.1

- type: replace
  path: /networks/name=default/subnets/0/reserved
  value:
  - 10.64.64.1-10.64.64.19
  - 10.64.64.51-10.64.127.254

- type: replace
  path: /networks/name=default/subnets/0/static
  value:
  - 10.64.64.50

- type: replace
  path: /networks/name=default/subnets/0/cloud_properties/bridge
  value: lvnet001
