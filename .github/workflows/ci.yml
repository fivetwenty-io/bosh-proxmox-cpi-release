name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  check:
    name: Check
    runs-on: self-hosted
    container:
      # Digest-pinned golang:1.26 (self-hosted runner has no build tools on the host)
      image: golang:1.26@sha256:0d1d3a794be25f809dd2cb3160d8c73276c4056a9f8242a138e908ddeee7b6b6

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mark workspace safe for git
        # The host-mounted workspace has a different owner than the container
        # user; without this, go tools fail with "error obtaining VCS status"
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/pve_cpi/go.mod
          cache-dependency-path: src/pve_cpi/go.sum

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run checks
        run: make check
