---
# Env bundle: lab — storage pool override
#
# Maps PVE storage pools to their roles in this lab:
#   data    lvmthin  — root (ephemeral) VM disks
#   zfs-1   zfspool  — persistent BOSH disks (requires disk_format: raw;
#                      zfspool block devices do not support qcow2)
#   local   dir      — stemcell uploads and ISO images
#
# Apply after manifests/bosh/cpi.yml so the pve_cpi job properties are
# already present.
#
# Usage:
#   bosh create-env ~/w/cloudfoundry/bosh-deployment/bosh.yml \
#     --state=manifests/bosh/state.json \
#     --vars-store=manifests/bosh/creds.yml \
#     -o manifests/bosh/cpi.yml \
#     -o manifests/envs/lab/storage-pools.yml \
#     -l manifests/bosh/vars.yml

# Root (ephemeral) VM disks: lvmthin pool named "data"
- type: replace
  path: /instance_groups/name=bosh/jobs/name=pve_cpi/properties/pve/vm_storage
  value: data

# Persistent BOSH disks: zfspool named "zfs-1"
# zfspool requires disk_format: raw — qcow2 is not supported for block devices.
- type: replace
  path: /instance_groups/name=bosh/jobs/name=pve_cpi/properties/pve/disk_storage
  value: zfs-1

- type: replace
  path: /instance_groups/name=bosh/jobs/name=pve_cpi/properties/pve/vm_disk_format
  value: raw

# Stemcell uploads and ISO images: local dir storage
- type: replace
  path: /instance_groups/name=bosh/jobs/name=pve_cpi/properties/pve/stemcell_storage
  value: local

# iso_storage: local is an EXPLICIT single-node choice here, not the CPI
# default behavior. pve.iso_storage_follow_vm_storage
# defaults to true: a deployment that leaves iso_storage unset resolves the
# ConfigDrive ISO pool to vm_storage instead, provided vm_storage advertises
# PVE content type `iso` and is shared. In this single-node lab, vm_storage
# is "data" (lvmthin), which cannot hold ISO files (block storages never
# advertise `iso` content) — so even with the default follow-vm-storage
# behavior active, resolution would fall back to iso_storage unchanged
# (logging a one-time startup Warn). Setting iso_storage: local explicitly
# below documents the intended pool and silences that fallback Warn; on a
# single node "local" is a safe choice because there is nothing else to
# migrate the ISO to. On a multi-node cluster, prefer a shared iso_storage
# pool (or vm_storage itself, via the default) instead of local.
- type: replace
  path: /instance_groups/name=bosh/jobs/name=pve_cpi/properties/pve/iso_storage
  value: local

# Propagate persistent-disk pool and format to the disk_pools block used
# during create-env bootstrap (before the director is running).
- type: replace
  path: /disk_pools/name=disks/cloud_properties
  value:
    storage: zfs-1
    disk_format: raw

# Mirror storage settings in cloud_provider for create-env bootstrap CPI.
- type: replace
  path: /cloud_provider/properties/pve/vm_storage
  value: data

- type: replace
  path: /cloud_provider/properties/pve/disk_storage
  value: zfs-1

- type: replace
  path: /cloud_provider/properties/pve/stemcell_storage
  value: local

- type: replace
  path: /cloud_provider/properties/pve/iso_storage
  value: local
