---
# Run instance groups in parallel and let each scale to ((cf_max_in_flight))
# concurrent create_vm calls. Sized for a PVE node configured with 12 worker
# threads — operations complete as quickly as the storage layer allows.
#
# History: this ops file previously pinned `update.serial: true` to throttle
# concurrent VM creates against PVE's per-storage lock. With worker count
# raised to 12 that bottleneck no longer dominates, so we revert to the
# cf-deployment default (serial: false) and only override max_in_flight.

- type: replace
  path: /update/serial
  value: false

- type: replace
  path: /update/max_in_flight
  value: ((cf_max_in_flight))
