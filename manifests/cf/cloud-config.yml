---
# ============================================================================
# WAYNE LAB OVERRIDE PAIR: When the network uses 10.64.64.0/18 (lvnet001),
# apply both override files together with `bosh update-cloud-config`:
#   -o manifests/wayne/cf-cloud-config-override.yml
# The BOSH director network must also be overridden:
#   -o manifests/wayne/network-override.yml  (applied at bosh create-env)
# Omitting cf-cloud-config-override.yml while network-override.yml is active
# leaves this file's reserved bands in 192.168.1.x, re-triggering the
# tailscale LAN route hazard (see memory: tailscale-lan-route-hazard).
# ============================================================================
#
# Cloud-config for cf-deployment on the bosh-pve director.
#
# Single-node PVE cluster, 3 AZ aliases (z1/z2/z3) all bound to the same
# node + bridge so cf-deployment's HA assumptions interpolate cleanly.
#
# Upload:
#   bosh -e pve update-cloud-config manifests/cf/cloud-config.yml \
#     -l manifests/bosh/vars.yml -l manifests/cf/vars.yml

azs:
- name: z1
- name: z2
- name: z3

vm_types:
# cf-deployment.yml references all of these by name; sizes tuned for a
# single-node lab cluster, not production.
- name: minimal
  cloud_properties:
    cores: 1
    # 1024 MB was too small for the tcp-router instance group; running
    # tcp-router + bosh-dns + dns_health + monit + the bosh-agent at the
    # same time starved the agent's NATS handler and the director saw
    # "Timed out sending get_state to instance tcp-router after 45 s" on
    # the canary. 2048 keeps headroom.
    memory: 2048
    disk: 8192
    network_bridge: ((pve_network_bridge))

- name: small
  cloud_properties:
    cores: 1
    memory: 2048
    disk: 16384
    network_bridge: ((pve_network_bridge))

- name: small-highmem
  cloud_properties:
    cores: 2
    memory: 4096
    disk: 16384
    network_bridge: ((pve_network_bridge))

- name: small-50GB-ephemeral-disk
  cloud_properties:
    cores: 1
    memory: 2048
    disk: 51200
    network_bridge: ((pve_network_bridge))

- name: small-highmem-100GB-ephemeral-disk
  cloud_properties:
    cores: 2
    memory: 8192
    disk: 102400
    network_bridge: ((pve_network_bridge))

- name: medium
  cloud_properties:
    cores: 2
    memory: 4096
    disk: 32768
    network_bridge: ((pve_network_bridge))

- name: large-100GB-ephemeral-disk
  cloud_properties:
    cores: 4
    memory: 16384
    disk: 102400
    network_bridge: ((pve_network_bridge))

- name: compilation
  cloud_properties:
    cores: 4
    memory: 4096
    disk: 32768
    network_bridge: ((pve_network_bridge))

disk_types:
- name: 5GB
  disk_size: 5120
  cloud_properties: {}
- name: 10GB
  disk_size: 10240
  cloud_properties: {}
- name: 100GB
  disk_size: 102400
  cloud_properties: {}

vm_extensions:
# cf-deployment expects these names; on PVE we have no IaaS LB / SG layer
# so they merge an empty cloud_properties hash. Harmless.
- name: cf-router-network-properties
  cloud_properties: {}
- name: diego-ssh-proxy-network-properties
  cloud_properties: {}
- name: cf-tcp-router-network-properties
  cloud_properties: {}
- name: 100GB_ephemeral_disk
  cloud_properties:
    disk: 102400
- name: 50GB_ephemeral_disk
  cloud_properties:
    disk: 51200

networks:
- name: default
  type: manual
  subnets:
  - range:   ((internal_cidr))
    gateway: ((internal_gw))
    dns:     [ 1.1.1.1, 8.8.8.8 ]
    # Reserve gateway, director, and a top-of-range band for routers / infra.
    reserved:
    - 192.168.1.1-192.168.1.19
    - 192.168.1.200-192.168.1.254
    static:
    - ((haproxy_private_ip))
    azs:     [ z1, z2, z3 ]
    cloud_properties:
      bridge: ((pve_network_bridge))

compilation:
  # The CPI VMID allocator now scatters its scan start across the VMID
  # range and retries on conflict, so concurrent create_vm calls no longer
  # collide on the same VMID. Safe to run multiple compilation workers.
  workers: 4
  reuse_compilation_vms: true
  az: z1
  vm_type: compilation
  network: default
