name: Certification

# Scheduled certification runs against the latest published release: the
# Director Upgrade certification (scripts/certify, N-1 -> N of the published
# releases) followed by a fresh director bootstrap on the latest tag and the
# BOSH Acceptance Tests (scripts/bats). Run reports are committed under
# docs/certification/ with the pass/fail-only headline policy: every run
# commits its run document, but the README "Latest run" headline only moves
# for a definite PASS or FAIL verdict, never UNKNOWN.
#
# The weekly slot is Saturday 02:30 UTC, well clear of the Monday 01:30
# (codeql) and Monday 06:00 (security) crons, so the lab and the runner are
# not contended.

on:
  schedule:
    - cron: "30 2 * * 6"
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Completed build run containing a candidate CPI artifact (empty uses published releases)"
        required: false
        type: string
      candidate_artifact:
        description: "Artifact name containing exactly one CPI .tgz; required with candidate_run_id"
        required: false
        type: string
      candidate_sha256:
        description: "Expected candidate tarball SHA256; required for a candidate run"
        required: false
        type: string
      skip_certify:
        description: "Skip the upgrade certification (supervised first runs)"
        required: false
        type: boolean
        default: false
      skip_bats:
        description: "Skip BATS (supervised first runs)"
        required: false
        type: boolean
        default: false

# contents: write is required to push the report branch; pull-requests: write
# opens and auto-merges the report PR (main is protected, so reports land
# through a PR gated on the required checks); actions: write approves the
# held pull_request runs the report PR raises; packages: read lets the job's
# GITHUB_TOKEN pull the private CI image from ghcr.
permissions:
  actions: write
  contents: write
  packages: read
  pull-requests: write

# Exactly one workflow may touch the lab at a time. Any FUTURE workflow that
# touches the lab (its PVE API, the director slot, or the cpitest network)
# MUST declare this same `lab` concurrency group; today this is the only one.
# cancel-in-progress stays false: killing a certify or BATS run mid-flight
# leaves the lab in a state the next run has to dig itself out of.
concurrency:
  group: lab
  cancel-in-progress: false

# Self-hosted lab runners host four jobs per VM on eight cores. Go sizes
# its build parallelism from the host core count, so each job fans out as
# if it owned the machine and four of them together exhaust the VM's
# memory. Runner-level env does not cross into container jobs; workflow
# env is part of the job context, which the runner does carry in.
env:
  GOMAXPROCS: 2

jobs:
  certification:
    name: Certify and BATS
    # Pinned to the bosh-lab label, which only the runners on the first
    # worker VM carry. The lab fleet grew to two VMs on 2026-08-24, and
    # gha-lab-state-certification below is a host directory that exists on
    # that first VM alone. A run scheduled onto the second VM would find an
    # empty mount, treat the certification Director as new, and build a
    # second one on the same IP while orphaning the live one. Keep this pin
    # as long as the certification Director's state lives on a single runner
    # host.
    runs-on: [self-hosted, bosh-lab]
    # BATS alone has taken 2h22m and certify 56m on this lab; six hours gives
    # both room plus the bootstrap without masking a wedged run forever.
    timeout-minutes: 360
    # Not PR-triggered, but keep the head-repo guard shape used by every
    # workflow in this repo: only this repository may use our runner.
    if: github.repository == 'fivetwenty-io/bosh-proxmox-cpi-release'

    container:
      # Built from ci/Dockerfile by .github/workflows/ci-image.yml. Pinned by
      # digest the way the other workflows pin golang:1.27; update the pin
      # from the digest a ci-image.yml run prints after a Dockerfile change.
      image: ghcr.io/fivetwenty-io/bosh-proxmox-cpi-ci@sha256:0861097ffeede7570271c78110c4a09d8e4affabecfd0db3eb7c85f99cdf1beb
      # Host-path caches follow the gha-container-cache pattern from ci.yml.
      # gha-lab-state-certification is DIFFERENT in kind: it is the
      # certification Director's slot (BOSH_STATE_DIR below), holding that
      # Director's create-env products (creds.yml, state.json) and its
      # slot.yml between runs, because losing them means every run rebuilds
      # the Director and orphans the old one. create-env reads and writes the
      # mounted directory directly. It holds lab credentials, so keep it mode
      # 0700, owner runner, and inside the lab. Only one runner VM carries
      # it, which is why this job pins its label. The other VMs should carry
      # a tripwire file at this path, so a run scheduled onto one fails on
      # its first write instead of building a second Director.
      #
      # The main Director's slot (gha-lab-state) is deliberately NOT mounted.
      # This job tears its Director down on every run, so it must have no
      # path at all to another Director's state. The certification slot must
      # start empty, and gha-lab-state must never be copied, moved, or linked
      # into it (docs/certification/scheduled.md).
      volumes:
        - /home/runner/gha-container-cache/go:/go
        - /home/runner/gha-container-cache/go-build:/root/.cache/go-build
        - /home/runner/gha-container-cache/uv:/root/.cache/uv
        - /home/runner/gha-lab-state-certification:/var/lib/lab-state-certification

    defaults:
      run:
        shell: bash

    env:
      # The runner overrides HOME to /github/home inside the container; point
      # the caches at the mounted paths (same reasoning as ci.yml).
      GOCACHE: /root/.cache/go-build
      UV_CACHE_DIR: /root/.cache/uv
      # Every scripts/bosh, scripts/certify, and scripts/bats call in this
      # job uses the certification slot. BOSH_REFUSE_DEFAULT_SLOT makes
      # scripts/bosh, scripts/certify, and the harnesses' shared Director env
      # refuse to run when the slot resolves to manifests/bosh in any
      # checkout, so a lost BOSH_STATE_DIR stops the job.
      BOSH_STATE_DIR: /var/lib/lab-state-certification
      BOSH_REFUSE_DEFAULT_SLOT: "1"
      # The main Director's VM CIDs, which on PVE are bare VMIDs, comma
      # separated. Every Director command refuses a slot whose state names
      # one of them, and with BOSH_REFUSE_DEFAULT_SLOT set they all refuse
      # while this is empty or malformed, so the job fails until the
      # repository variable of the same name holds a VMID list. The runner's
      # checkout holds no main Director state, so nothing here can notice a
      # stale list. Each create-env that rebuilds the main Director gives it
      # a new VMID, and the variable must be updated after every one.
      BOSH_PROTECTED_DIRECTOR_CIDS: ${{ vars.BOSH_PROTECTED_DIRECTOR_CIDS }}
      BOSH_PVE_ENV: cpitest
      # scripts/certify and the release-resolution step shell out to gh.
      GH_TOKEN: ${{ github.token }}
      # The container has no known_hosts; accept the lab node's key on first
      # contact (lab-only trust, per the scripts/bosh _pve_ssh contract).
      SCRIPTS_PVE_SSH_INSECURE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the report meta runs `git describe --tags` and the
          # report auto-commit rebases onto the remote before pushing.
          fetch-depth: 0

      - name: Mark workspace safe for git
        # The host-mounted workspace has a different owner than the container
        # user; without this, git commands fail with "dubious ownership"
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898024+github-actions[bot]@users.noreply.github.com"

      - name: Materialize ci/integration.yml from the committed fixture
        env:
          # Repository VARIABLE (not a secret): lab topology, the PVE node
          # the BATS az pins to. Empty is valid on shared-storage labs.
          LAB_BATS_TARGET_NODE: ${{ vars.LAB_BATS_TARGET_NODE }}
        run: |
          set -euo pipefail
          umask 077
          sed "s|\${BATS_TARGET_NODE}|${LAB_BATS_TARGET_NODE}|g" \
            ci/integration.scheduled.yml > ci/integration.yml
          # Comment lines in the fixture legitimately mention ${VAR}; only a
          # placeholder outside a comment means the substitution missed one.
          if grep -nE '^[^#]*\$\{' ci/integration.yml; then
            echo "ERROR: unsubstituted placeholder left in ci/integration.yml" >&2
            exit 1
          fi

      - name: Write lab secrets (manifests/bosh/vars.yml)
        env:
          LAB_BOSH_VARS_YML: ${{ secrets.LAB_BOSH_VARS_YML }}
        run: |
          set -euo pipefail
          if [[ -z "${LAB_BOSH_VARS_YML}" ]]; then
            echo "ERROR: the LAB_BOSH_VARS_YML secret is not configured for this repository." >&2
            echo "Add it from a checkout that has the lab vars file:" >&2
            echo "  gh secret set LAB_BOSH_VARS_YML --repo fivetwenty-io/bosh-proxmox-cpi-release < manifests/bosh/vars.yml" >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "${LAB_BOSH_VARS_YML}" > manifests/bosh/vars.yml

      - name: Write lab SSH key
        # scripts/bosh net-up and the firewall ensure run pvesh on
        # the PVE node over `ssh root@<pve_host>`; the key is authorized on
        # lab-pmx-0 restricted to the pipes node's SNAT address.
        env:
          LAB_PVE_SSH_KEY: ${{ secrets.LAB_PVE_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${LAB_PVE_SSH_KEY}" ]]; then
            echo "ERROR: the LAB_PVE_SSH_KEY secret is not configured for this repository." >&2
            echo "Generate a dedicated key, authorize it for root on the lab PVE node, then:" >&2
            echo "  gh secret set LAB_PVE_SSH_KEY --repo fivetwenty-io/bosh-proxmox-cpi-release < <keyfile>" >&2
            exit 1
          fi
          umask 077
          # OpenSSH expands ~ from the passwd entry, not $HOME, and container
          # jobs run with HOME=/github/home while the passwd home is /root.
          ssh_home="$(getent passwd "$(id -u)" | cut -d: -f6)"
          mkdir -p "${ssh_home}/.ssh"
          printf '%s\n' "${LAB_PVE_SSH_KEY}" > "${ssh_home}/.ssh/id_ed25519"

      - name: Write the certification slot config
        # The slot directory is mounted from the runner host, so the
        # Director's creds.yml and state.json from the previous run are
        # already in place and create-env reads and writes them there. This
        # step renders slot.yml, which gives the certification Director its
        # own IP, alias, name, and VM name segment, from the committed
        # template and the certification_director_ip key in the vars secret.
        # Only this step writes slot.yml, so a state.json or creds.yml in a
        # slot without one was put there by hand and the step stops.
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$(tr -d ' ,' <<<"${BOSH_PROTECTED_DIRECTOR_CIDS:-}")" ]]; then
            echo "ERROR: the BOSH_PROTECTED_DIRECTOR_CIDS repository variable is empty, so nothing protects the main Director." >&2
            echo "Set it to the main Director's VM CID, which on PVE is the bare VMID (comma-separate several):" >&2
            echo "  gh variable set BOSH_PROTECTED_DIRECTOR_CIDS --repo fivetwenty-io/bosh-proxmox-cpi-release --body <vmid>" >&2
            exit 1
          fi
          vmid_list='^[[:space:]]*[1-9][0-9]*[[:space:]]*(,[[:space:]]*[1-9][0-9]*[[:space:]]*)*$'
          if [[ ! "${BOSH_PROTECTED_DIRECTOR_CIDS}" =~ ${vmid_list} ]]; then
            echo "ERROR: the BOSH_PROTECTED_DIRECTOR_CIDS repository variable is not a list of VMIDs, so it would protect nothing." >&2
            echo "It must be bare PVE VMIDs, comma separated with nothing else in it, such as 3808 or 3808,3809:" >&2
            echo "  gh variable set BOSH_PROTECTED_DIRECTOR_CIDS --repo fivetwenty-io/bosh-proxmox-cpi-release --body <vmid>" >&2
            exit 1
          fi
          if [[ ! -d "${BOSH_STATE_DIR}" || ! -w "${BOSH_STATE_DIR}" ]]; then
            echo "ERROR: the certification slot ${BOSH_STATE_DIR} is not a writable directory." >&2
            echo "Create /home/runner/gha-lab-state-certification on the bosh-lab runner VM (owner runner, mode 0700)." >&2
            exit 1
          fi
          if [[ ! -e "${BOSH_STATE_DIR}/slot.yml" ]]; then
            for seeded in state.json creds.yml; do
              if [[ -e "${BOSH_STATE_DIR}/${seeded}" || -L "${BOSH_STATE_DIR}/${seeded}" ]]; then
                echo "ERROR: ${BOSH_STATE_DIR}/${seeded} exists, but no earlier run of this workflow wrote slot.yml there." >&2
                echo "The slot must start empty. Never copy, move, or link gha-lab-state or any other Director's files into it." >&2
                echo "Move state.json and creds.yml out of /home/runner/gha-lab-state-certification on the runner host, leave the VM they name alone, and run again." >&2
                exit 1
              fi
            done
          fi
          rendered="$(mktemp)"
          errors="$(mktemp)"
          if ! bosh int ci/certification-slot.yml -l manifests/bosh/vars.yml --var-errs > "${rendered}" 2> "${errors}"; then
            if grep -q certification_director_ip "${errors}"; then
              echo "ERROR: the LAB_BOSH_VARS_YML secret has no certification_director_ip." >&2
              echo "Add certification_director_ip (a free cpitest address inside cpitest_reserved, not the main Director's internal_ip) to the lab vars file, then:" >&2
              echo "  gh secret set LAB_BOSH_VARS_YML --repo fivetwenty-io/bosh-proxmox-cpi-release < manifests/bosh/vars.yml" >&2
            else
              echo "ERROR: bosh could not render ci/certification-slot.yml against the LAB_BOSH_VARS_YML secret:" >&2
              cat "${errors}" >&2
            fi
            rm -f "${rendered}" "${errors}"
            exit 1
          fi
          install -m 0600 "${rendered}" "${BOSH_STATE_DIR}/slot.yml"
          rm -f "${rendered}" "${errors}"
          echo "wrote ${BOSH_STATE_DIR}/slot.yml"

      - name: Validate candidate selection
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          if [[ -n "${CANDIDATE_RUN_ID}${CANDIDATE_ARTIFACT}${CANDIDATE_SHA256}" ]]; then
            [[ "${CANDIDATE_RUN_ID}" =~ ^[0-9]+$ ]]
            [[ -n "${CANDIDATE_ARTIFACT}" ]]
            [[ "${CANDIDATE_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]]
          fi

      - name: Resolve candidate CPI artifact
        if: ${{ inputs.candidate_run_id != '' }}
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          run_metadata="$(gh run view "${CANDIDATE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --json conclusion,status,workflowName,headSha)"
          printf '%s' "${run_metadata}" | jq -e \
            '.conclusion == "success" and .status == "completed" and .workflowName == "Candidate Release"' >/dev/null
          candidate_dir="$(mktemp -d "${RUNNER_TEMP}/cpi-candidate.XXXXXX")"
          gh run download "${CANDIDATE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "${CANDIDATE_ARTIFACT}" --dir "${candidate_dir}"
          shopt -s globstar nullglob
          candidates=("${candidate_dir}"/**/*.tgz)
          [[ "${#candidates[@]}" -eq 1 ]]
          python3 scripts/_release_artifact.py "${candidates[0]}" \
            --sha256 "${CANDIDATE_SHA256}" --github-env "${GITHUB_ENV}"
          source_commit="$(printf '%s' "${run_metadata}" | jq -r .headSha)"
          [[ "${source_commit}" =~ ^[0-9a-f]{40}$ ]]
          echo "PVE_CPI_RELEASE_COMMIT=${source_commit}" >> "${GITHUB_ENV}"
          echo "PVE_CPI_CANDIDATE_RUN_ID=${CANDIDATE_RUN_ID}" >> "${GITHUB_ENV}"
          old_spec="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          echo "PVE_CPI_OLD_RELEASE_SPEC=${old_spec}" >> "${GITHUB_ENV}"

      - name: Resolve the latest published release
        if: ${{ inputs.candidate_run_id == '' }}
        id: release
        run: |
          set -euo pipefail
          TAG="$(gh release view --json tagName --jq .tagName)"
          VERSION="${TAG#v}"
          mkdir -p .deps/cpi-releases
          # Tags v0.4.0 and earlier publish their assets under the pre-rename
          # bosh-pve-cpi-<version>.tgz filenames forever; try the current
          # asset name first, then fall back to the legacy one.
          CPI_TARBALL="bosh-proxmox-cpi-${VERSION}.tgz"
          if ! gh release download "${TAG}" \
            --pattern "${CPI_TARBALL}*" \
            --dir .deps/cpi-releases --clobber; then
            CPI_TARBALL="bosh-pve-cpi-${VERSION}.tgz"
            gh release download "${TAG}" \
              --pattern "${CPI_TARBALL}*" \
              --dir .deps/cpi-releases --clobber
          fi
          (cd .deps/cpi-releases && sha256sum -c "${CPI_TARBALL}.sha256")
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          # The director bootstrap and BATS both read this: create-env bakes
          # the CPI it points at, and the BATS report records its basename as
          # the director's CPI provenance.
          python3 scripts/_release_artifact.py ".deps/cpi-releases/${CPI_TARBALL}" --github-env "${GITHUB_ENV}"

      - name: Upgrade certification (scripts/certify)
        if: ${{ !inputs.skip_certify }}
        timeout-minutes: 150
        # --force gives unattended slot handling, so the certification
        # Director left standing by the previous run's bootstrap is torn down
        # instead of failing preflight. BOSH_STATE_DIR (job env) points
        # certify at the certification slot, and certify refuses to run in
        # the default slot. --keep stays off because the run must end with a
        # free slot for the bootstrap below.
        run: |
          set -euo pipefail
          cpi_args=()
          if [[ -n "${PVE_CPI_CANDIDATE_RUN_ID:-}" ]]; then
            cpi_args=(--old-cpi "${PVE_CPI_OLD_RELEASE_SPEC}" --new-cpi "${PVE_CPI_RELEASE_PATH}")
          fi
          ./scripts/certify upgrade --env cpitest --force \
            --headline-pass-fail-only --no-color "${cpi_args[@]}"

      - name: Bootstrap director on the selected release
        timeout-minutes: 90
        # Minimal director bring-up in the certification slot (the emptyvm
        # smoke and CF are out of scope here: BATS itself is the acceptance
        # check). net-up is idempotent; it only matters when certify was
        # skipped on a lab whose cpitest SDN objects are missing, because
        # certify no longer removes the network the main Director shares.
        run: |
          set -euo pipefail
          echo "bootstrapping director from ${PVE_CPI_RELEASE_PATH}"
          ./scripts/bosh net-up
          ./scripts/bosh create-env
          ./scripts/bosh alias-env
          ./scripts/bosh login
          ./scripts/bosh ucc
          ./scripts/bosh runtime-config
          ./scripts/bosh upload-stemcell

      - name: BATS (scripts/bats)
        if: ${{ !inputs.skip_bats }}
        run: |
          set -uo pipefail
          set +e
          ./scripts/bats run --env cpitest --headline-pass-fail-only --no-color
          rc=$?
          set -e
          if [[ "${rc}" -eq 2 ]]; then
            # Locally exit 2 is the soft "ruby/bundler not installed" skip.
            # The CI image bakes ruby and bundler, so here it can only mean
            # the image regressed — that is a failure, not a skip.
            echo "ERROR: scripts/bats exited 2 (ruby/bundler missing). The CI image bakes ruby, so the image has regressed." >&2
            exit 1
          fi
          exit "${rc}"

      - name: Commit run reports
        if: always()
        # main is protected by required status checks the job's token cannot
        # bypass, so reports ride a per-run branch whose PR auto-merges once
        # those checks pass. One step at the end covers both the certify and
        # BATS reports; always() still fires it when a lab phase fails.
        env:
          REPORT_BRANCH: certification-reports-${{ github.run_id }}
        run: |
          set -euo pipefail
          git add docs/certification
          if git diff --cached --quiet; then
            echo "no certification doc changes to commit"
            exit 0
          fi
          git commit -m "docs(certification): scheduled run reports $(date -u +%F)"
          # Rebase onto the current main tip: a report branch cut from the
          # sha this run tested inherits any failure that sha carried and
          # its PR wedges until someone update-branches it. -X theirs keeps
          # this run's regenerated README when a same-day report PR already
          # touched it; the next run regenerates it from all run docs anyway.
          git fetch origin main
          if ! git rebase -X theirs origin/main; then
            git rebase --abort
            echo "WARN: rebase onto origin/main conflicted; report PR keeps the tested sha as its base" >&2
          fi
          git push origin "HEAD:refs/heads/${REPORT_BRANCH}"
          gh pr create --repo "${GITHUB_REPOSITORY}" \
            --head "${REPORT_BRANCH}" --base main \
            --title "docs(certification): scheduled run reports $(date -u +%F)" \
            --body "Automated certification reports from certification run ${GITHUB_RUN_ID}."
          gh pr merge "${REPORT_BRANCH}" --repo "${GITHUB_REPOSITORY}" --auto --rebase
          # Opening the PR raises pull_request runs of the three check
          # workflows, but GitHub holds them for approval: their actor is
          # github-actions[bot], which is not a collaborator, and the repo
          # requires approval for every external contributor's runs (the
          # fork-PR guard for the shared self-hosted runner). Nobody is at
          # the keyboard at 02:30 UTC on a Saturday, so unapproved runs would
          # expire as failures and the PR would never see its required
          # checks. Approve them here with the job's token (actions: write
          # covers the approve endpoint); once approved they run like any
          # PR's checks, report on the PR's own rollup, and auto-merge fires.
          #
          # Fail the step if the runs never appear or an approval is refused:
          # the reports are already on the branch and the PR is open, so a
          # red run is the signal to dispatch the check workflows on the
          # report branch by hand and admin-merge it (see
          # docs/certification/scheduled.md).
          approve_held_runs() {
            local rows="" id="" state="" total=0 approved=0 failed=0
            # The held runs are created when the PR opens; give them two
            # minutes to appear, and expect one per check workflow.
            for _ in $(seq 1 12); do
              rows="$(gh run list --repo "${GITHUB_REPOSITORY}" --branch "${REPORT_BRANCH}" \
                --event pull_request --limit 20 --json databaseId,status,conclusion \
                --jq '.[] | [.databaseId, (if .conclusion == "action_required" then "action_required" else .status end)] | @tsv' || true)"
              total="$(printf '%s\n' "${rows}" | grep -c . || true)"
              [[ "${total}" -ge 3 ]] && break
              sleep 10
            done
            if [[ "${total}" -lt 3 ]]; then
              echo "ERROR: only ${total} pull_request run(s) appeared on ${REPORT_BRANCH}; the report PR needs manual checks" >&2
              return 1
            fi
            while IFS=$'\t' read -r id state; do
              [[ -n "${id}" ]] || continue
              if [[ "${state}" != "action_required" ]]; then
                echo "run ${id} is ${state}; no approval needed"
                continue
              fi
              if gh api --silent -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve"; then
                approved=$((approved + 1))
              else
                echo "ERROR: could not approve held run ${id}" >&2
                failed=$((failed + 1))
              fi
            done <<<"${rows}"
            echo "approved ${approved} held pull_request run(s) on ${REPORT_BRANCH}"
            [[ "${failed}" -eq 0 ]]
          }
          approve_held_runs

      - name: Remove materialized secrets
        if: always()
        # The workspace persists between jobs on a self-hosted runner. The
        # certification Director's state stays in the mounted slot directory
        # on the runner host (see the volumes comment above), so nothing in
        # the workspace needs persisting.
        run: |
          ssh_home="$(getent passwd "$(id -u)" | cut -d: -f6)"
          # creds.yml and state.json under manifests/bosh are the default
          # slot's files. This job never writes them, and removing any stray
          # copy keeps the workspace free of another Director's state.
          rm -f manifests/bosh/vars.yml manifests/bosh/creds.yml \
            manifests/bosh/state.json ci/integration.yml \
            "${ssh_home}/.ssh/id_ed25519"
