name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      purge_go_build_cache:
        description: >-
          Run go clean -cache before the checks. The self-hosted runners on
          one host share a single go-build cache, and a concurrent job can
          leave a corrupt object in it that every later build on that host
          then links against (the tell is a linker panic naming an inlined
          function with "missing func info"). This evicts it at the cost of
          one cold build.
        type: boolean
        default: false
      runner:
        description: >-
          Runner label to pin the job to. Each host keeps its own cache, so a
          purge has to land on the host that holds the bad object.
        type: string
        default: self-hosted
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request pushes are cancelled; main and release runs are
  # never cut short, because the release workflow gates on this one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Self-hosted lab runners host four jobs per VM on eight cores. Go sizes
# its build parallelism from the host core count, so each job fans out as
# if it owned the machine and four of them together exhaust the VM's
# memory. Runner-level env does not cross into container jobs; workflow
# env is part of the job context, which the runner does carry in.
env:
  GOMAXPROCS: 2

jobs:
  check:
    name: Check
    # Push, pull-request, and workflow_call runs carry no inputs, so they fall
    # through to the shared label.
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    timeout-minutes: 30
    # Fork pull requests must not run untrusted code on a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    container:
      # Digest-pinned golang:1.27 (self-hosted runner has no build tools on the host)
      image: golang:1.27@sha256:512690a5660563b57d37ecc31129e7f136e831db2aed24a1dbeb8ad7380dc0fa
      # The container filesystem is fresh on every job, so the Go module and
      # build caches would start cold. These are host paths rather than the
      # Actions cache service: on a persistent self-hosted runner, restoring a
      # ~2GB cache.tzst costs more than the build it saves and floods the log
      # with tar "Cannot open: File exists" errors against Go's read-only
      # module cache. They live outside _work, so the runner's workspace
      # reclaim hook leaves them alone and root ownership here is harmless.
      volumes:
        - /home/runner/gha-container-cache/go:/go
        - /home/runner/gha-container-cache/go-build:/root/.cache/go-build

    env:
      # The runner overrides HOME to /github/home inside the container, so the
      # default GOCACHE would land there -- inside _work/_temp, wiped between
      # jobs and outside the mount above. Point it at the mounted path.
      GOCACHE: /root/.cache/go-build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mark workspace safe for git
        # The host-mounted workspace has a different owner than the container
        # user; without this, go tools fail with "error obtaining VCS status"
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/pve_cpi/go.mod
          # The mounted /go volume is the module cache; the action's own
          # cache would restore a second copy over it and fail on tar.
          cache: false

      - name: Purge the shared Go build cache
        if: ${{ inputs.purge_go_build_cache == true }}
        run: go clean -cache

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      - name: Install Python for script tests
        # make check gates on py-test (scripts/*_test.py). The golang:1.27
        # container ships python3 (Debian) but not PyYAML, which
        # scripts/_integration.py imports; python3-yaml supplies it from the
        # image's own Debian release so the version tracks the pinned digest.
        # The explicit python3 check keeps a future image change loud instead
        # of failing later inside make with a less obvious error.
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 python3-yaml
          command -v python3

      - name: Run checks
        run: make check REQUIRE_TOOLS=1
