# ci/tasks/unit.yml
#
# Runs `make check` from the repository root. The root Makefile delegates
# Go linting, vetting, and tests to src/pve_cpi.
#
# No secrets required. Runs on any Concourse worker.

platform: linux

image_resource:
  type: docker-image
  source:
    repository: golang
    tag: "1.26"
    digest: "sha256:2d6c80227255c3112a4d08e67ba98e58efd3846daf15d9d7d4c389565d881b1a"

inputs:
  - name: repo

run:
  path: /bin/bash
  args:
    - -euc
    - |
      export NO_COLOR=1
      cd repo
      make check
      make security
