---
# Env bundle: lab — VMID range override
#
# Sets pve.vmid_range_start to 200 so the CPI allocates VMIDs from 200
# upward. VMIDs 100-199 are reserved for manually-managed VMs (drgao-bastion=100,
# wayne-bastion=101, ocfp-artifacts=138, etc.).
#
# Only the start is overridden here; every other band keeps its spec default,
# so this env's effective bands are VMs 200-8999, persistent disks 9000-29999,
# and stemcell templates 30000-30999. The multi-CPI manifests/cpi-config.yml
# narrows these further per entry so two clusters never share a band — see
# docs/multi-cluster.md.
#
# Property: pve.vmid_range_start (jobs/pve_cpi/spec).
#
# Apply after manifests/bosh/cpi.yml.
#
# Usage:
#   bosh create-env ~/w/cloudfoundry/bosh-deployment/bosh.yml \
#     --state=manifests/bosh/state.json \
#     --vars-store=manifests/bosh/creds.yml \
#     -o manifests/bosh/cpi.yml \
#     -o manifests/envs/lab/vmid-range.yml \
#     -l manifests/bosh/vars.yml

- type: replace
  path: /instance_groups/name=bosh/jobs/name=pve_cpi/properties/pve/vmid_range_start
  value: 200

- type: replace
  path: /cloud_provider/properties/pve/vmid_range_start
  value: 200
