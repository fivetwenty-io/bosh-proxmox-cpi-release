# ci/tasks/integration.yml
#
# Runs the full integration test suite (Tier 1 + Tier 2 + Tier 3).
# Requires a lab-network Concourse worker (192.168.1.0/24 reachable).
#
# Image: ubuntu:24.04 (noble) — minimal, stable, reproducible base with
# apt-get available.  All required CLIs (bosh, cf, credhub, uv, jq, curl,
# go, make) are installed at task start via the inline apt-get + curl block
# below.  Pinning to a dated ubuntu release rather than bosh/bosh-cli:latest
# avoids silent breakage when upstream layers change.  When a custom lab
# image is available that pre-bundles all CLIs, replace image_resource with
# that image's registry coordinates and remove the inline install block.
#
# Prerequisite inputs: bosh-deployment and cf-deployment Git checkouts must
# be present at the paths named by BOSH_DEPLOYMENT_DIR and CF_DEPLOYMENT.
#
# Secret vars (BOSH_VARS_YAML, CF_VARS_YAML) are base64-encoded content of
# manifests/bosh/vars.yml and manifests/cf/vars.yml respectively.  The task
# decodes them to ephemeral 0600 temp files and passes their paths into the
# integration config overlay so that no plaintext credentials are written into
# the repo workspace tree.
#
# manifests/bosh/creds.yml is GENERATED by `bosh create-env` during the
# `all` run (Tier 2).  It is not injected by the pipeline — do not add it
# as a param or input.  PVE credentials and BOSH TLS secrets live in
# manifests/bosh/vars.yml (decoded from BOSH_VARS_YAML above).

platform: linux

image_resource:
  type: registry-image
  source:
    repository: ubuntu
    tag: "24.04"
    digest: "sha256:c4a8d5503dfb2a3eb8ab5f807da5bc69a85730fb49b5cfca2330194ebcc41c7b"

inputs:
  - name: repo

params:
  STEMCELL_PATH:       ""
  BOSH_DEPLOYMENT_DIR: ""
  CF_DEPLOYMENT:       ""
  BOSH_VARS_YAML:      ""   # base64-encoded content of manifests/bosh/vars.yml
  CF_VARS_YAML:        ""   # base64-encoded content of manifests/cf/vars.yml

run:
  path: /bin/bash
  args:
    - -euc
    - |
      export NO_COLOR=1
      export STEMCELL_PATH="${STEMCELL_PATH}"
      export BOSH_DEPLOYMENT_DIR="${BOSH_DEPLOYMENT_DIR}"
      export CF_DEPLOYMENT="${CF_DEPLOYMENT}"

      # ---------------------------------------------------------------
      # Install required CLIs.  This block is only reached when the task
      # runs on the ubuntu:24.04 base image.  When the pipeline is
      # migrated to a custom lab image that pre-bundles these tools,
      # remove this block and update image_resource accordingly.
      #
      # Pinned versions:
      #   bosh-cli   7.8.5   (matches packages/golang-1.26 build target)
      #   cf-cli     8.x     (CF Foundry maintained apt repo)
      #   credhub    2.9.37  (matches director credhub version in vars)
      #   uv         0.4.x   (astral-sh installer; latest stable)
      #   jq         1.7.x   (ubuntu 24.04 repo)
      #   curl, make, ca-certificates shipped with ubuntu base layer
      # ---------------------------------------------------------------
      BOSH_CLI_VERSION="7.8.5"
      CREDHUB_CLI_VERSION="2.9.37"

      apt-get update -qq
      apt-get install -y --no-install-recommends \
        ca-certificates curl make jq python3 python3-yaml wget gnupg2 apt-transport-https

      # bosh CLI
      if ! command -v bosh >/dev/null 2>&1; then
        curl -fsSL "https://github.com/cloudfoundry/bosh-cli/releases/download/v${BOSH_CLI_VERSION}/bosh-cli-${BOSH_CLI_VERSION}-linux-amd64" \
          -o /usr/local/bin/bosh
        chmod +x /usr/local/bin/bosh
      fi

      # cf CLI (v8 from Cloud Foundry apt repo)
      if ! command -v cf >/dev/null 2>&1; then
        curl -fsSL "https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key" \
          | gpg --dearmor -o /usr/share/keyrings/cloudfoundry-cli.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudfoundry-cli.gpg] https://packages.cloudfoundry.org/debian stable main" \
          > /etc/apt/sources.list.d/cloudfoundry-cli.list
        apt-get update -qq
        apt-get install -y --no-install-recommends cf8-cli
      fi

      # credhub CLI
      if ! command -v credhub >/dev/null 2>&1; then
        curl -fsSL "https://github.com/cloudfoundry/credhub-cli/releases/download/${CREDHUB_CLI_VERSION}/credhub-linux-amd64-${CREDHUB_CLI_VERSION}.tgz" \
          -o /tmp/credhub.tgz
        tar -xzf /tmp/credhub.tgz -C /usr/local/bin credhub
        chmod +x /usr/local/bin/credhub
        rm -f /tmp/credhub.tgz
      fi

      # uv (Python package/script runner used by scripts/lifecycle et al.)
      if ! command -v uv >/dev/null 2>&1; then
        curl -fsSL "https://astral.sh/uv/install.sh" | sh
        export PATH="${HOME}/.local/bin:${PATH}"
      fi

      # ---------------------------------------------------------------

      # Validate params before touching the filesystem.
      if [ -z "${BOSH_VARS_YAML}" ]; then echo "BOSH_VARS_YAML param is empty" >&2; exit 1; fi
      if [ -z "${CF_VARS_YAML}" ];   then echo "CF_VARS_YAML param is empty"   >&2; exit 1; fi

      # Allocate secure temp files BEFORE decoding any secret content.
      # mktemp templates name the process for debuggability in /tmp listings.
      VARS_TMP="$(mktemp /tmp/integration-bosh-vars.XXXXXX)"
      CF_VARS_TMP="$(mktemp /tmp/integration-cf-vars.XXXXXX)"
      INT_CFG_TMP="$(mktemp /tmp/integration-cfg.XXXXXX)"
      chmod 600 "${VARS_TMP}" "${CF_VARS_TMP}"

      # Register cleanup trap on EXIT, ERR, INT, and TERM so secrets are
      # destroyed regardless of how the script terminates — including early
      # failure under set -e (set -e causes ERR to fire, which triggers EXIT;
      # registering on EXIT alone is sufficient for set -e shells, but explicit
      # ERR/INT/TERM traps ensure cleanup even when set -e is temporarily
      # suspended or the script is killed by a signal).
      _cleanup() {
        shred -u "${VARS_TMP}"    2>/dev/null || rm -f "${VARS_TMP}"
        shred -u "${CF_VARS_TMP}" 2>/dev/null || rm -f "${CF_VARS_TMP}"
        rm -f "${INT_CFG_TMP}"
      }
      trap '_cleanup' EXIT ERR INT TERM

      # Decode secret vars into the secured temp files.
      printf '%s' "${BOSH_VARS_YAML}" | base64 -d > "${VARS_TMP}"
      printf '%s' "${CF_VARS_YAML}"   | base64 -d > "${CF_VARS_TMP}"

      # Write a runtime integration-config overlay that points bosh_vars and
      # cf_vars at the temp file paths.  The overlay inherits all non-secret
      # settings from the checked-in ci/integration.yml via Python's yaml.safe_load
      # then overrides only the two path keys — no secrets land in the overlay file.
      python3 - "${VARS_TMP}" "${CF_VARS_TMP}" "${INT_CFG_TMP}" <<'PYEOF'
      import sys, yaml, pathlib
      vars_tmp, cf_vars_tmp, out = sys.argv[1], sys.argv[2], sys.argv[3]
      src = pathlib.Path("repo/ci/integration.yml")
      cfg = yaml.safe_load(src.read_text()) if src.exists() else {}
      cfg["bosh_vars"] = vars_tmp
      cfg["cf_vars"]   = cf_vars_tmp
      pathlib.Path(out).write_text(yaml.dump(cfg, default_flow_style=False))
      PYEOF

      cd repo
      ./scripts/test integration all --config "${INT_CFG_TMP}"
