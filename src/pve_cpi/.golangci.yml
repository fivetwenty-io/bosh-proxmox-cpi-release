# golangci-lint v2 configuration (schema version "2", requires golangci-lint >= v2.0)
# Installed: v2.12.2  |  Go module: go 1.26.4
#
# Complexity thresholds (gocyclo/gocognit) are tightened to 40 following the
# handler phase-helper extraction wave (HandleCreateVM, HandleCreateNetwork,
# HandleDeleteVM, HandleCreateDisk, HandleCreateStemcell, HandleRebootVM,
# HandleAttachDisk, HandleDetachDisk, HandleCalculateVMCloudProperties, and
# config.ValidateWithLogger all decomposed). The next reduction target is 30.
#
# Residual production functions over gocognit 40, measured with standalone
# gocognit (`gocognit -over 40 cmd internal`; golangci-lint embeds its own
# copy, numbers can drift slightly between versions). Regenerate this table
# whenever the threshold moves:
#   - HandleCreateStemcell closure (light-vs-heavy dispatch): 118 (gocyclo 48)
#   - resolveTargetNodeWithFallbacks (multi-AZ placement loop): 86
#   - HandleCreateDisk closure (parse+attempt+rollback orchestration): 80
#   - createNetworkSDN (zone+vnet+subnet+apply with rollback chain): 61
#   - HandleResizeDisk (not yet refactored): 53
#   - createVMWithFallback (alternate-node retry ladder): 52
#   - HandleUpdateDisk (sequential option-merge phases): 43
#   - probeGuestAgentIPConflict / detectIPConflict (probe fan-outs): 41 each
# TestResolveSource (~62) is a table-driven test; lint flags it but no
# behaviour change is warranted.

version: "2"

linters:
  default: none
  enable:
    # Carried over from golangci-lint default set
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Extended gate — R1 CAT-2..14
    - errorlint
    - forbidigo
    - gocritic
    - noctx
    - revive
    - godoclint
    - nakedret
    - forcetypeassert
    - gocognit
    - gocyclo
    - goconst
    - misspell
    - prealloc
    - unconvert
    - unparam

  settings:
    forbidigo:
      # Match method calls on arbitrary receivers (deps.PVE.Storage().X), not
      # just package-qualified identifiers. NB: patterns are matched against
      # the expression with intermediate call parens stripped —
      # deps.PVE.Tasks().GetStatus is matched as deps.PVE.Tasks.GetStatus —
      # so patterns must never include literal \(\).
      analyze-types: true
      forbid:
        # PVE's DELETE queues an async imgdel task; the sync DeleteVolume /
        # DeleteVolumeIfExists variants discard the UPID, so a queued imgdel
        # can destroy a subsequently-recreated volume of the same name. Sync
        # DeleteVolumeIfExists remains allowed only where no same-name reuse
        # follows; plain DeleteVolume has no safe first-party use.
        - pattern: '\.DeleteVolume$'
          msg: "sync DeleteVolume discards the imgdel UPID; use DeleteVolumeAsync + pve.AwaitTaskWithLogger"
        # Task awaiting is policy (adaptive poll, log streaming, timeout
        # classification) owned by internal/pve; handlers must not hand-roll
        # polling against the raw tasks service. Allowed inside internal/pve
        # via the path exclusion below.
        - pattern: '\.Tasks\b'
          msg: "await tasks via pve.AwaitTask / pve.AwaitTaskWithLogger, not raw Tasks() polling"

    gocyclo:
      min-complexity: 40

    gocognit:
      min-complexity: 40

    nakedret:
      max-func-lines: 30

    goconst:
      # 8 occurrences keeps signal on genuinely repeated domain literals
      # while ignoring JSON map keys that recur across handler test helpers.
      min-occurrences: 8
      min-len: 3

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        # single-case switch → if fires in generated stub files; suppress here.
        - singleCaseSwitch
        # Pure formatting opinion — group adjacent same-type params on one line.
        - paramTypeCombine
        # Suggests passing 100+-byte structs by pointer; the affected helpers
        # are read-only consumers where value semantics are clearer.
        - hugeParam
        # Suggests naming all return values; readability trade-off, not a bug.
        - unnamedResult
        # Stylistic preference between `len(x) == 0` and `x == ""`; both clear.
        - emptyStringTest
        # Stylistic; both `bytes.Equal` and `string(b) == string(b2)` correct.
        - stringXbytes

    revive:
      rules:
        - name: exported
        - name: var-naming
        # package-comments rule disabled: convention is one doc.go per package;
        # firing on every file with a top comment is overly strict.
        - name: unused-parameter
          arguments:
            - allowRegex: "^_$"
        - name: receiver-naming
        - name: error-strings
        - name: errorf

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    unparam:
      check-exported: false

  exclusions:
    # Skip auto-detected generated files (standard "// Code generated" marker).
    generated: lax
    rules:
      # Exclude the panic stub test file — generated, not hand-maintained.
      - path: ".*_stub_test\\.go$"
        linters:
          - errcheck
          - govet
          - ineffassign
          - staticcheck
          - unused
          - errorlint
          - gocritic
          - noctx
          - revive
          - godoclint
          - nakedret
          - forcetypeassert
          - gocognit
          - gocyclo
          - goconst
          - misspell
          - prealloc
          - unconvert
          - unparam
      # Vendor directory — never lint dependencies.
      - path: "vendor/"
        linters:
          - errcheck
          - govet
          - ineffassign
          - staticcheck
          - unused
          - errorlint
          - gocritic
          - noctx
          - revive
          - godoclint
          - nakedret
          - forcetypeassert
          - gocognit
          - gocyclo
          - goconst
          - misspell
          - prealloc
          - unconvert
          - unparam
      # CLI startup error reporting writes to stderr/stdout before os.Exit; the
      # fmt.Fprintf/Fprintln return value is the standard Go CLI idiom to drop.
      - path: "cmd/cpi/.*\\.go$"
        text: "Error return value of `(fmt\\.Fprintf|fmt\\.Fprintln)` is not checked"
        linters:
          - errcheck
      # internal/pve owns task-await policy (AwaitTask, adaptive poll); the
      # raw Tasks() service is its implementation surface, not a bypass.
      - path: "internal/pve/"
        text: "await tasks via pve.AwaitTask"
        linters:
          - forbidigo
      # Test fakes implement and directly exercise the forbidden sync methods.
      - path: "_test\\.go$"
        linters:
          - forbidigo
      # Test files: a number of linter classes generate noise without surfacing
      # real defects in test code. Tests are allowed to panic on bad inputs,
      # repeat domain literals for table-driven cases, shadow imported package
      # names with local mock variables, pass nil request bodies, etc.
      - path: "_test\\.go$"
        linters:
          - forcetypeassert
          - goconst
      - path: "_test\\.go$"
        text: "(importShadow|hugeParam|httpNoBody|octalLiteral|elseif|zeroByteRepeat|stringXbytes|commentedOutCode|deferUnlambda):"
        linters:
          - gocritic
      - path: "_test\\.go$"
        text: "unused-parameter:"
        linters:
          - revive
      # godoclint "has more than one godoc" fires for every non-doc.go file
      # whose first comment touches the `package <name>` line; Go convention
      # accepts file-level descriptors when one doc.go owns the package godoc.
      - text: "has more than one godoc"
        linters:
          - godoclint
      # godoclint "package godoc should start with" duplicates the revive
      # `package-comments` rule (already disabled). The convention is one
      # doc.go per package; firing on every non-doc.go file is overreach.
      - text: "package godoc should start with"
        linters:
          - godoclint
    paths:
      - vendor/

issues:
  # Show all findings — Cluster F uses the full list to target cleanup.
  max-issues-per-linter: 0
  max-same-issues: 0
