---
# Lab-tuned vm_type overrides for cf-deployment instance groups whose
# default `small` / `minimal` allocations OOM or run hot under modest
# load on this single-node PVE cluster.
#
# All target vm_types are declared in cloud-config.yml.
#
#   api          2c / 4 GiB     medium
#   cc-worker    2c / 4 GiB     small-highmem
#   database     2c / 4 GiB     medium                          (CC+UAA+diego SQL)
#   diego-cell   4c / 16 GiB    large-100GB-ephemeral-disk      (incl. 100 GB ephemeral)
#   doppler      1c / 2 GiB     small
#   haproxy      1c / 2 GiB     small
#   router       1c / 2 GiB     small
#   scheduler    1c / 2 GiB     small
#   uaa          2c / 4 GiB     small-highmem
#
# Apply alongside ops-serialize-deploy.yml on every deploy.

- type: replace
  path: /instance_groups/name=api/vm_type
  value: medium

- type: replace
  path: /instance_groups/name=cc-worker/vm_type
  value: small-highmem

- type: replace
  path: /instance_groups/name=database/vm_type
  value: medium

- type: replace
  path: /instance_groups/name=diego-cell/vm_type
  value: large-100GB-ephemeral-disk

- type: replace
  path: /instance_groups/name=doppler/vm_type
  value: small

- type: replace
  path: /instance_groups/name=haproxy/vm_type
  value: small

- type: replace
  path: /instance_groups/name=router/vm_type
  value: small

- type: replace
  path: /instance_groups/name=scheduler/vm_type
  value: small

- type: replace
  path: /instance_groups/name=uaa/vm_type
  value: small-highmem

# Instance counts — collapse every group to a single instance to fit this
# single-node PVE lab. diego-cell stays at 2 so app containers have somewhere
# to reschedule during a cell update. Errands (smoke-tests, rotate-*) carry no
# `instances` and are left alone.

- type: replace
  path: /instance_groups/name=nats/instances
  value: 1

- type: replace
  path: /instance_groups/name=database/instances
  value: 1

- type: replace
  path: /instance_groups/name=diego-api/instances
  value: 1

- type: replace
  path: /instance_groups/name=uaa/instances
  value: 1

- type: replace
  path: /instance_groups/name=singleton-blobstore/instances
  value: 1

- type: replace
  path: /instance_groups/name=api/instances
  value: 1

- type: replace
  path: /instance_groups/name=cc-worker/instances
  value: 1

- type: replace
  path: /instance_groups/name=scheduler/instances
  value: 1

- type: replace
  path: /instance_groups/name=router/instances
  value: 1

- type: replace
  path: /instance_groups/name=tcp-router/instances
  value: 1

- type: replace
  path: /instance_groups/name=log-cache/instances
  value: 1

- type: replace
  path: /instance_groups/name=log-api/instances
  value: 1

- type: replace
  path: /instance_groups/name=doppler/instances
  value: 1

- type: replace
  path: /instance_groups/name=credhub/instances
  value: 1

- type: replace
  path: /instance_groups/name=haproxy/instances
  value: 1

- type: replace
  path: /instance_groups/name=diego-cell/instances
  value: 2
