---
# Runtime-config addon: install + enable the QEMU guest agent on every BOSH
# VM the director deploys. PVE polls the QGA socket (`agent: enabled=1` is
# set by the CPI at VM create time in create_vm.go) so IP discovery, freeze-
# fs snapshots, and `qm guest cmd` only work once the in-guest daemon is
# running.
#
# Upload with:
#   ./scripts/bosh runtime-config
#
# Stemcell (bosh-openstack-kvm-ubuntu-noble) does NOT ship qemu-guest-agent;
# the pre-start script installs it on first boot (detached, best-effort) and
# is a no-op thereafter. The install runs in the background so a slow or
# unreachable apt mirror can never stall pre-start (a long blocking pre-start
# can drop the director<->agent NATS link and wedge the deploy). Air-gapped
# sites should pre-bake the package or mirror it on a reachable apt repo.
#
# Residual gap: QGA is only reachable AFTER the detached install completes
# (typically seconds when the mirror is healthy). During that window the
# `unstick-agent` fallback (PVE `qm guest exec`) is unavailable, which
# matters only if bosh-agent itself wedges on the very same boot before the
# QGA install finishes. A PVE-side cicustom cloud-init runcmd would close
# this gap, but the BOSH openstack-kvm Noble stemcell ships neither
# `cloud-init` nor `qemu-guest-agent` (verified via SBOM in stemcell
# 1.364), so a cicustom snippet would never be parsed. Fully closing the
# gap therefore requires a stemcell-level change (pre-bake QGA or
# cloud-init). The pre-start path below is the smallest-blast-radius
# mitigation until that change lands.
#
# `./scripts/cf unstick-agent` performs a QGA `ping` probe with a bounded
# wait so an operator gets an actionable error rather than a raw
# `qm guest exec` failure during the install window.

releases:
- name:    os-conf
  version: 23.0.0
  url:     https://bosh.io/d/github.com/cloudfoundry/os-conf-release?v=23.0.0
  sha1:    d20772d8ce6e781ceb13cac7df5950bfa4330ba1

addons:
- name: pve-guest-agent
  jobs:
  - name:    pre-start-script
    release: os-conf
    properties:
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # qemu-guest-agent.service on Ubuntu Noble is a STATIC unit (no
        # [Install] section, no WantedBy). It is activated by udev via the
        # virtio-serial device. `systemctl enable` errors on static units, so
        # use `start` only (idempotent — no-op if already running).
        start_qga() {
          systemctl start qemu-guest-agent.service 2>/dev/null || true
        }

        # Fast path: already installed — ensure it is running and return.
        if command -v qemu-ga >/dev/null 2>&1; then
          start_qga
          exit 0
        fi

        # Install path: NEVER block pre-start. A synchronous apt run against a
        # slow or unreachable mirror takes minutes, and while the BOSH agent
        # waits on pre-start the director<->agent NATS link can drop and fail
        # to recover — wedging the deploy at the pre-start canary with the VM
        # otherwise healthy. So install fully detached and best-effort:
        # pre-start returns immediately, the package lands moments later, and a
        # flaky apt can neither stall nor fail the deploy. Bounded with
        # timeouts and a single retry so it can never run unattended forever.
        logdir=/var/vcap/sys/log/pve-guest-agent
        mkdir -p "$logdir"
        setsid bash -c '
          export DEBIAN_FRONTEND=noninteractive
          opts="-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          timeout 120 apt-get $opts update -y \
            || echo "pve-guest-agent: apt-get update failed/timed out, continuing"
          timeout 180 apt-get $opts install -y --no-install-recommends qemu-guest-agent \
            || echo "pve-guest-agent: qemu-guest-agent install failed/timed out"
          systemctl start qemu-guest-agent.service 2>/dev/null || true
          # Briefly wait for the unit to settle so the log records an
          # active state, and drop a sentinel for the unstick-agent path
          # to confirm a completed install without re-probing apt.
          for _ in 1 2 3 4 5; do
            if systemctl is-active --quiet qemu-guest-agent.service; then
              date -Iseconds > /var/vcap/sys/log/pve-guest-agent/installed.flag
              echo "pve-guest-agent: qemu-guest-agent active"
              break
            fi
            sleep 2
          done
        ' </dev/null >>"$logdir/install.log" 2>&1 &
        exit 0
  include:
    stemcell:
    - os: ubuntu-jammy
    - os: ubuntu-noble
  # BATS (deployment "bat") expects VMs with no addon jobs: its service
  # configuration spec compares the full monit process list against the
  # job's own pid, so any rider breaks it. Keep BATS VMs stemcell-pristine.
  exclude:
    deployments:
    - bat
