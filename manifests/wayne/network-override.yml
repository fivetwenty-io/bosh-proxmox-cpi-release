---
# ============================================================================
# PAIRED OVERRIDE: When applying this network-override to BOSH deploys, also
# apply ./cf-cloud-config-override.yml so cf/cloud-config subnets match.
# Mismatch re-triggers the tailscale LAN route hazard (see memory + docs).
# ============================================================================
#
# Wayne lab network override — lvnet001 (10.64.64.0/18)
#
# Apply after manifests/bosh/cpi.yml. Overrides the default network
# range from 192.168.1.0/24 to the Wayne bloc's lvnet001 bridge.
#
# IPAM allocations:
#   10.64.64.1   gateway (lvnet001 bridge IP on pve node)
#   10.64.64.2   reserved (infrastructure)
#   10.64.64.3   bastion (VMID 101)
#   10.64.64.4-9 reserved (infrastructure band)
#   10.64.64.10  mgmt-BOSH director
#   10.64.64.11  reserved (artifacts VM — do not allocate)
#   10.64.64.12  env-BOSH director
#   10.64.64.13-19 reserved (infrastructure band)
#   10.64.64.20-49 dynamic (CF VMs, BOSH-managed)
#   10.64.64.50  haproxy (static)
#   10.64.64.51+ dynamic continuation
#
# Usage:
#   bosh create-env ~/w/cloudfoundry/bosh-deployment/bosh.yml \
#     --state=manifests/bosh/state.json \
#     --vars-store=manifests/bosh/creds.yml \
#     -o manifests/bosh/cpi.yml \
#     -o manifests/wayne/network-override.yml \
#     -l manifests/bosh/vars.yml

- type: replace
  path: /networks/name=default/subnets/0/range
  value: 10.64.64.0/18

- type: replace
  path: /networks/name=default/subnets/0/gateway
  value: 10.64.64.1

- type: replace
  path: /networks/name=default/subnets/0/reserved
  value:
  - 10.64.64.1-10.64.64.9
  - 10.64.64.11
  - 10.64.64.13-10.64.64.19

- type: replace
  path: /networks/name=default/subnets/0/cloud_properties/bridge
  value: lvnet001
