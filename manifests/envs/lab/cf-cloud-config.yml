---
# ============================================================================
# Env bundle: lab — CF cloud-config network override.
#
# Auto-layered by `scripts/cf cloud-config` (and the full `deploy`) when
# BOSH_PVE_ENV=lab. Replaces the default subnet (192.168.1.0/24 on the shared
# LAN bridge) with the isolated lab network. All values are pulled from
# manifests/envs/lab/vars.yml so a single edit there re-shapes both the
# Director network and this cloud-config in lockstep.
#
# Direct invocation:
#   bosh -e pve update-cloud-config manifests/cf/cloud-config.yml \
#     -o manifests/envs/lab/cf-cloud-config.yml \
#     -l manifests/bosh/vars.yml -l manifests/cf/vars.yml \
#     -l manifests/envs/lab/vars.yml
# ============================================================================

- type: replace
  path: /networks/name=default/subnets/0/range
  value: ((internal_cidr))

- type: replace
  path: /networks/name=default/subnets/0/gateway
  value: ((internal_gw))

- type: replace
  path: /networks/name=default/subnets/0/reserved
  value: ((lab_reserved))

- type: replace
  path: /networks/name=default/subnets/0/static
  value: ((lab_static))

- type: replace
  path: /networks/name=default/subnets/0/cloud_properties/bridge
  value: ((pve_network_bridge))
