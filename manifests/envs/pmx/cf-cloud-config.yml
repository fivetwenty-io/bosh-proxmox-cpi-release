---
# ============================================================================
# Env bundle: pmx — CF cloud-config network override.
#
# Auto-layered by `scripts/cf cloud-config` (and the full `deploy`) when
# BOSH_PVE_ENV=pmx. Replaces the default subnet with the nested-lab network
# (10.253.0.0/16 on the nested host's vmbr0, BOSH block 10.253.32.0/20). All
# values are pulled from manifests/envs/pmx/vars.yml so a single edit there
# re-shapes both the Director network and this cloud-config in lockstep.
#
# Direct invocation:
#   bosh -e pve update-cloud-config manifests/cf/cloud-config.yml \
#     -o manifests/envs/pmx/cf-cloud-config.yml \
#     -l manifests/bosh/vars.yml -l manifests/cf/vars.yml \
#     -l manifests/envs/pmx/vars.yml
# ============================================================================

- type: replace
  path: /networks/name=default/subnets/0/range
  value: ((internal_cidr))

- type: replace
  path: /networks/name=default/subnets/0/gateway
  value: ((internal_gw))

- type: replace
  path: /networks/name=default/subnets/0/reserved
  value: ((pmx_reserved))

- type: replace
  path: /networks/name=default/subnets/0/static
  value: ((pmx_static))

- type: replace
  path: /networks/name=default/subnets/0/cloud_properties/bridge
  value: ((pve_network_bridge))
