name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: self-hosted
    timeout-minutes: 30
    # Fork pull requests must not run untrusted code on a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["go"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        # CodeQL runs on the runner host rather than in the golang container,
        # so the toolchain comes from setup-go instead of the image.
        uses: actions/setup-go@v7
        with:
          go-version-file: src/pve_cpi/go.mod
          cache-dependency-path: src/pve_cpi/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Manual: the module lives in src/pve_cpi, not at the repository
          # root, so autobuild has nothing to find where it looks first.
          build-mode: manual

      - name: Build
        run: cd src/pve_cpi && go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
