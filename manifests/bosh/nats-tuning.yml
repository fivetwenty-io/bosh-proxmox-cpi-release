---
# Ops file: minimise director<->agent NATS mbus disruption during deploys.
#
# Mitigations in this file
# ------------------------
# 1. SHORTEN `nats-sync.intervals.poll_user_sync` to 10s (the bosh release
#    default). The CF deploy runs PARALLEL (cf-deployment update.serial=false,
#    canaries=0): BOSH creates all VMs first, then runs the heavy update steps.
#    A short poll front-loads NATS-user registration so auth.json reaches its
#    final, stable content within seconds of the create burst — i.e. BEFORE the
#    instances enter "installing packages"/post-start. Once auth.json is stable
#    no further reloads fire, so the heavy update window is reload-free and
#    agents are not dropped while busy.
#
#    This is the opposite of the earlier tuning, which RAISED the poll to 120s
#    to reduce reload frequency. That was counterproductive here: a long poll
#    lets a late create-phase registration land DURING the update window, firing
#    a reload exactly when an instance is mid-heavy-step — the wedge condition.
#    Reload frequency during the (harmless) create window does not matter,
#    because agents that are merely booting reconnect cleanly; what matters is
#    that auth.json is settled before the update window, which a short poll
#    guarantees.
#
# 2. Widen the server ping window (ping_interval 30s x ping_max_outstanding 3
#    ~= 120s) so a momentarily-busy agent is not additionally RST'd for a slow
#    PONG. Heartbeat liveness (hm.agent.heartbeat.*) is independent of mbus
#    PING/PONG, and HM agent_timeout (hm-tuning.yml) still reaps truly dead
#    agents, so this does not mask real failures.
#
# Usage: applied automatically by `scripts/bosh create-env`. Takes effect on the
# next director redeploy. VERIFY the rendered value after redeploy:
#   ssh root@<pve_host> qm guest exec <director_vmid> -- \
#     grep poll_user_sync /var/vcap/jobs/nats/config/bosh_nats_sync_config.yml
# (the director VM has QGA enabled via os-conf; cf VMs do not).
#
# Rollback: drop the ops file from scripts/bosh and redeploy the director.

- type: replace
  path: /instance_groups/name=bosh/properties/nats-sync?/intervals?/poll_user_sync?
  value: 10

- type: replace
  path: /instance_groups/name=bosh/properties/nats/ping_interval?
  value: 30s

- type: replace
  path: /instance_groups/name=bosh/properties/nats/ping_max_outstanding?
  value: 3
