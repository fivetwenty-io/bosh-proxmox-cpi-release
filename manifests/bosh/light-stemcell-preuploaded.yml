---
# Light stemcell manifest — pre-uploaded mode.
#
# Use this stemcell record when the qcow2 disk image has already been placed on
# PVE storage. scripts/{bosh,cf,e2e} place it automatically via the shared
# scripts/_lightstemcell.py helper (download the heavy tarball once, extract +
# normalize the qcow2, upload to PVE storage, fast-path on the stored SHA);
# operators may also place it by hand with "pvesm upload" or the PVE web UI.
# The CPI skips the upload step and returns a "light:<storage>:import/<file>"
# CID that points directly to the existing volume.
#
# cloud_properties.image_id  — PVE volid of the pre-uploaded image.
#   Format: "<storage>:import/<filename.qcow2>"
#
# Interpolation variables (supply with -v or via the helper):
#   stemcell_version   — stemcell version (kept in lockstep with vars.yml
#                        stemcell_url, e.g. "1.383")
#   stemcell_storage   — PVE storage pool that holds the image (e.g. "local")
#   stemcell_filename  — qcow2 filename without a path prefix
#                        (e.g. "bosh-stemcell-ubuntu-noble-1.383-deadbeef.qcow2")
#
# OS is standardized on ubuntu-noble across all deployment paths; change it here
# (and the cf stemcell-pin ops file) if migrating the lab to another OS.
#
# The CPI verifies the image exists on PVE before accepting the stemcell.
# If the file is absent, create_stemcell returns a Cloud error and the upload fails.

name: bosh-proxmox-kvm-ubuntu-noble-go_agent-light
version: ((stemcell_version))
sha1: 0000000000000000000000000000000000000000
operating_system: ubuntu-noble
stemcell_formats:
- proxmox-kvm
cloud_properties:
  node: ((pve_node))
  image_id: "((stemcell_storage)):import/((stemcell_filename))"
  name: ubuntu-noble
  version: ((stemcell_version))
  disk_format: qcow2
  os_type: l26
  disk: 10240
