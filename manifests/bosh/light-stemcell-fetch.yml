---
# Light stemcell manifest — CPI-assisted fetch mode.
#
# Use this stemcell record when the qcow2 disk image lives at a remote URL
# (HTTPS, S3, OCI, or BOSH blobstore). The CPI fetches and uploads the image
# to PVE storage automatically; subsequent uploads for the same name+version
# are deduplicated by SHA-256 so re-uploading is safe and fast.
#
# scripts/{bosh,cf,e2e} select fetch mode when light_stemcell_mode: fetch and
# render this template via scripts/_lightstemcell.py.
#
# cloud_properties.image_url       — remote URL of the qcow2 disk image.
#   Supported schemes: https://, s3://, oci://, bosh+blobstore:
#
# cloud_properties.image_url_auth  — optional per-stemcell credentials.
#   Supported types: basic, bearer, s3, blobstore, oci.
#   This example uses type=bearer; see docs/light-stemcells.md for full schemas.
#   Leave stemcell_token empty for public URLs.
#
# Interpolation variables (supply with -v or via the helper):
#   stemcell_version — stemcell version (kept in lockstep with vars.yml, e.g. "1.383")
#   stemcell_url     — full remote URL of the qcow2 image
#   stemcell_token   — Bearer token for authenticated downloads; "" for public
#
# OS is standardized on ubuntu-noble across all deployment paths.
#
# The CPI streams the image directly from the remote URL to PVE storage; the
# full image is not staged locally on the BOSH Director before upload.

name: bosh-proxmox-kvm-ubuntu-noble-go_agent-light-fetch
version: ((stemcell_version))
sha1: 0000000000000000000000000000000000000000
operating_system: ubuntu-noble
stemcell_formats:
- proxmox-kvm
cloud_properties:
  image_url: "((stemcell_url))"
  image_url_auth:
    type: bearer
    bearer_token: "((stemcell_token))"
  name: ubuntu-noble
  version: ((stemcell_version))
  disk_format: qcow2
  os_type: l26
  disk: 10240
