---
# update-cloud-config-only override (applied by `scripts/bosh ucc`, never by
# create-env). Widens the bosh cloud-config's default-network reserved band to
# the same infra band CF uses (pmx_reserved), so a VM placed on the bosh
# cloud-config — emptyvm in particular — lands in the dynamic middle
# (10.253.16.20+) instead of a low infra slot the env keeps for the gateway,
# the nested host, and the Director (orphan-vm-duplicate-ip-after-delete-env).
#
# pmx_reserved (manifests/envs/pmx/vars.yml) is the single source of truth
# for the infra band and is layered in by `scripts/bosh ucc` via the env
# vars file.
- type: replace
  path: /networks/name=default/subnets/0/reserved
  value: ((pmx_reserved))
